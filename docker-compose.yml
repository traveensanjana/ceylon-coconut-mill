services:
  web:
    build: .
    image: YOUR_DOCKERHUB_USERNAME/ceylon-coconut-mill:latest
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=rootpass
      - DB_NAME=tom
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=tom
    volumes:
      - db_data:/var/lib/mysql
      - ./users_tables.sql:/docker-entrypoint-initdb.d/users_tables.sql
    ports:
      - "3306:3306"

volumes:
  db_data:

networks:
  default:
    name: coconut-mill-network

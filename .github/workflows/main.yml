name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP files (basic syntax check)
        run: |
          for f in *.php; do
            php -l "$f"
          done

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/ceylon-coconut-mill:latest .

      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/ceylon-coconut-mill:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ceylon-coconut-mill:latest

      - name: Stop and remove old container (if running)
        run: |
          docker stop coconut-mill-app
          docker rm coconut-mill-app
          exit 0

      - name: Run new container
        run: docker run -d --name coconut-mill-app --network coconut-mill-network -p 8080:80 -e DB_HOST=db -e DB_USER=root -e DB_PASS=rootpass -e DB_NAME=tom ${{ secrets.DOCKERHUB_USERNAME }}/ceylon-coconut-mill:latest